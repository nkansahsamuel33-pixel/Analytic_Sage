version: '3.8'

services:
  db:
    image: postgres:18
    container_name: postgres-container
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: crypto_ass_1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  ingest:
    build: .
    container_name: ingest-container
    environment:
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db  # Points to the 'db' service above!
      - DB_PORT=5432
      - DB_NAME=crypto_ass_1
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata: