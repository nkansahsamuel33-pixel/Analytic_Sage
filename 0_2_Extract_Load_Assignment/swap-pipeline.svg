<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">Uniswap V3 swap extraction pipeline</title>
  <desc id="description">Swap events from three Uniswap V3 pools are queried through Ethereum JSON-RPC by a Python extractor running in a Docker container, then loaded idempotently into PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6bd"/>
      <stop offset="1" stop-color="#68a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6 1 11" fill="none" stroke="#6883a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { fill: #8da3c0; font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #f3f7fc; font-size: 40px; font-weight: 700; letter-spacing: -.8px; }
      .subtitle { fill: #a9bad0; font-size: 17px; }
      .card-title { fill: #f3f7fc; font-size: 20px; font-weight: 650; }
      .label { fill: #a9bad0; font-size: 14px; }
      .body { fill: #d7e1ee; font-size: 15px; }
      .small { fill: #8da3c0; font-size: 12px; }
      .mono { fill: #d7e1ee; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="26" fill="url(#background)"/>
  <circle cx="1300" cy="90" r="220" fill="#3268a8" opacity=".08"/>
  <circle cx="120" cy="760" r="250" fill="#41c9af" opacity=".06"/>

  <text x="84" y="74" class="eyebrow">DATA ENGINEERING · EXTRACT &amp; LOAD</text>
  <text x="84" y="128" class="title">Uniswap V3 Swap Extractor</text>
  <text x="84" y="163" class="subtitle">On-chain swap logs, decoded and loaded into PostgreSQL over a selected block range.</text>

  <rect x="84" y="204" width="1272" height="78" rx="16" fill="#182740" stroke="#263b58"/>
  <text x="112" y="235" class="eyebrow" style="font-size:12px; letter-spacing:2px">LOCAL RUN</text>
  <text x="112" y="261" class="mono" style="font-size:16px">uv run python swap.py --start_block 20000000 --end_block 20000020 --chunk 10</text>
  <rect x="1202" y="222" width="126" height="40" rx="20" fill="#173c43"/>
  <circle cx="1223" cy="242" r="5" fill="#54d6bd"/>
  <text x="1237" y="247" fill="#9ae7d7" font-size="12" font-weight="700">INCLUSIVE RANGE</text>

  <path d="M370 465H420" stroke="#6883a4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 465H750" stroke="#6883a4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1030 465H1080" stroke="#6883a4" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="84" y="326" width="286" height="278" rx="20" fill="#142238" stroke="#2b405e"/>
    <rect x="84" y="326" width="286" height="5" rx="3" fill="#8a6cff"/>
    <circle cx="122" cy="371" r="19" fill="#2b2551"/>
    <path d="M115 371h14M122 364v14" stroke="#bcaeff" stroke-width="2" stroke-linecap="round"/>
    <text x="153" y="378" class="card-title">Uniswap V3 pools</text>
    <text x="110" y="420" class="label">EVENT SOURCE · ETHEREUM</text>
    <rect x="110" y="441" width="234" height="38" rx="10" fill="#1c2d46"/>
    <circle cx="128" cy="460" r="4" fill="#54d6bd"/>
    <text x="142" y="465" class="body">ETH / USDC</text>
    <rect x="110" y="488" width="234" height="38" rx="10" fill="#1c2d46"/>
    <circle cx="128" cy="507" r="4" fill="#68a8ff"/>
    <text x="142" y="512" class="body">WBTC / USDC</text>
    <rect x="110" y="535" width="234" height="38" rx="10" fill="#1c2d46"/>
    <circle cx="128" cy="554" r="4" fill="#f3bd69"/>
    <text x="142" y="559" class="body">XDP / USDC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="326" width="280" height="278" rx="20" fill="#142238" stroke="#2b405e"/>
    <rect x="420" y="326" width="280" height="5" rx="3" fill="#68a8ff"/>
    <circle cx="458" cy="371" r="19" fill="#1e3558"/>
    <path d="M449 371h18M458 362v18M452 365l12 12M464 365l-12 12" stroke="#9dc6ff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="489" y="378" class="card-title">Ethereum JSON-RPC</text>
    <text x="446" y="420" class="label">WEB3.PY · HTTP PROVIDER</text>
    <rect x="446" y="444" width="228" height="68" rx="12" fill="#1b2c45"/>
    <text x="463" y="470" class="body">eth_getLogs</text>
    <text x="463" y="493" class="small">Pool addresses + Swap topic</text>
    <text x="446" y="549" class="small">Block timestamps fetched once</text>
    <text x="446" y="569" class="small">per block and cached.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="326" width="280" height="278" rx="20" fill="#142238" stroke="#2b405e"/>
    <rect x="750" y="326" width="280" height="5" rx="3" fill="#54d6bd"/>
    <circle cx="788" cy="371" r="19" fill="#1b4545"/>
    <path d="M778 370h19v7h-19zM781 365h5v5h-5zM787 365h5v5h-5zM793 365h4v5h-4zM778 380c2 2 15 2 18 0" fill="none" stroke="#8be5d2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="819" y="378" class="card-title">Docker container</text>
    <text x="776" y="420" class="label">DOCKERFILE · PYTHON EXTRACTOR</text>
    <text x="776" y="460" class="body">Runs swap.py with Web3.py</text>
    <text x="776" y="488" class="body">Installs locked deps with uv</text>
    <text x="776" y="516" class="body">Receives RPC + DB env values</text>
    <rect x="776" y="545" width="228" height="34" rx="9" fill="#173c43"/>
    <text x="790" y="567" fill="#9ae7d7" font-size="12" font-weight="650">docker run --env-file .env ...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="326" width="276" height="278" rx="20" fill="#142238" stroke="#2b405e"/>
    <rect x="1080" y="326" width="276" height="5" rx="3" fill="#f3bd69"/>
    <circle cx="1118" cy="371" r="19" fill="#493a27"/>
    <ellipse cx="1118" cy="365" rx="8" ry="3.5" fill="none" stroke="#f6d295" stroke-width="1.6"/>
    <path d="M1110 365v12c0 2 4 4 8 4s8-2 8-4v-12M1110 371c0 2 4 4 8 4s8-2 8-4" fill="none" stroke="#f6d295" stroke-width="1.6"/>
    <text x="1149" y="378" class="card-title">PostgreSQL</text>
    <text x="1106" y="420" class="label">DESTINATION · swaps</text>
    <rect x="1106" y="441" width="224" height="95" rx="12" fill="#1b2c45"/>
    <text x="1122" y="464" class="mono">block · timestamp</text>
    <text x="1122" y="485" class="mono">pool · sender · recipient</text>
    <text x="1122" y="506" class="mono">amount0 · amount1 · tick</text>
    <text x="1106" y="561" class="small">Unique key: tx_hash + log_index</text>
    <text x="1106" y="580" class="small">Duplicates are ignored on insert.</text>
  </g>

  <path d="M84 650H1356" stroke="#263b58" stroke-width="1"/>
  <text x="84" y="690" class="eyebrow" style="font-size:12px; letter-spacing:2px">BUILT FOR SAFE RE-RUNS</text>
  <text x="84" y="718" class="subtitle" style="font-size:14px">Inclusive block ranges  ·  Configurable chunks  ·  UTC timestamps  ·  Duplicate-safe inserts</text>
  <text x="84" y="758" fill="#f3bd69" font-size="12" font-weight="600">Docker note: image uses Python 3.13; project requires 3.14+.</text>
  <text x="1356" y="758" text-anchor="end" class="small">ANALYTIC SAGE DE · EXTRACT / LOAD ASSIGNMENT</text>
</svg>
